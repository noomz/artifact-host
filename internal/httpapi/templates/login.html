<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>artifact-host admin</title>
<style>
  :root { color-scheme: dark; }
  body { font: 15px/1.4 ui-sans-serif, system-ui, sans-serif; background: #111; color: #eee; margin: 0; }
  main { max-width: 28rem; margin: 12vh auto; padding: 0 1.25rem; }
  h1 { font-size: 1.15rem; font-weight: 600; }
  p { color: #aaa; }
  label { display: block; margin: 1rem 0 0.35rem; }
  input { width: 100%; box-sizing: border-box; padding: 0.55rem 0.65rem; border: 1px solid #333; border-radius: 6px; background: #1a1a1a; color: #eee; }
  button { margin-top: 1rem; padding: 0.5rem 0.9rem; border: 0; border-radius: 6px; background: #3b82f6; color: #fff; font: inherit; cursor: pointer; }
  .err { color: #f87171; }
</style>
<main>
  <h1>artifact-host</h1>
  <p>Admin token. Same value as <code>ARTIFACT_HOST_ADMIN_TOKEN</code>.</p>
  {{if .Err}}<p class="err">{{.Err}}</p>{{end}}
  <form method="post" action="/admin/login">
    <label for="token">Token</label>
    <input id="token" name="token" type="password" autocomplete="current-password" required>
    <button type="submit">Sign in</button>
  </form>
</main>
