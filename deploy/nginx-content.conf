# Per-site content hosts for password and share-link access.
# The wildcard cert comes from deploy/setup-wildcard-cert.sh, not certbot --nginx,
# so certbot never rewrites this file.

server {
    listen 80;
    server_name *.u.artifacts.noomz.space;
    # Share-link paths carry the token. Do not log them, even on plain HTTP.
    access_log off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name *.u.artifacts.noomz.space;

    ssl_certificate /etc/letsencrypt/live/u.artifacts.noomz.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/u.artifacts.noomz.space/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # The app routes on Host, sets Secure cookies from X-Forwarded-Proto, and
    # rate-limits password attempts on the last X-Forwarded-For entry.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_read_timeout 60s;
    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:8088;
    }

    # The path is the share-link token. Error log lines quote the request, so
    # drop both logs here.
    location ^~ /__ah/link/ {
        access_log off;
        error_log /dev/null;
        proxy_pass http://127.0.0.1:8088;
    }
}
